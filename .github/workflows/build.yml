name: Build and Sign Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Web Project & Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "Cipher of Baphomet" "com.vectormediadesign.cipherofbaphomet" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Enforce MinSDK 24 & TargetSDK 34
        run: |
          # 1. Update variables.gradle to minSdk 24 and targetSdk 34
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. Hardcode build.gradle to enforce min 24 and target 34
          sed -i 's/minSdkVersion.*/minSdkVersion 24/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' android/app/build.gradle

          # 3. Inject tools namespace and forced uses-sdk tag into AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              data = f.read()

          if 'xmlns:tools=' not in data:
              data = data.replace('<manifest ', '<manifest xmlns:tools=\"http://schemas.android.com/tools\" ')

          uses_sdk_tag = '<uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"34\" tools:replace=\"android:minSdkVersion,android:targetSdkVersion\" />\n'
          if '<uses-sdk' in data:
              import re
              data = re.sub(r'<uses-sdk[^>]*/>', uses_sdk_tag.strip(), data)
          else:
              data = data.replace('<application', uses_sdk_tag + '    <application')

          with open(manifest_path, 'w') as f:
              f.write(data)
          "

          # 4. Kotlin duplicate resolution
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      }
                  }
              }
          }
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias baphomet-upload-key \
            -dname "CN=Vector Media & Design, OU=Development, O=Vector Media, L=Chicago, ST=Illinois, C=US" \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026"

      - name: Build Android App Bundle (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Sign Android App Bundle
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Signing bundle found at: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-upload-key.jks \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026" \
            "$AAB_FILE" baphomet-upload-key

      - name: Inspect Built Manifest Inside AAB
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Verifying manifest attributes inside compiled AAB..."
          unzip -p "$AAB_FILE" base/manifest/AndroidManifest.xml | strings | grep -i -E "minsdk|targetsdk" || true

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 7

name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Scaffold Capacitor Project
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Cipher of Baphomet" "com.vectormediadesign.cipherofbaphomet" --web-dir www
          npx cap add android

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Lock Orientation to Portrait
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="sensorPortrait" /g' android/app/src/main/AndroidManifest.xml

      - name: Configure Gradle Unsigned Release Fallback
        run: |
          cd android
          # Ensure release build doesn't fail on missing signing config
          echo "android.buildTypes.release.signingConfig = null" >> app/build.gradle || true

      - name: Build Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate and Stage AAB
        run: |
          mkdir -p release-bundle
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} release-bundle/cipher-of-baphomet-release.aab \;
          ls -lah release-bundle/

      - name: Upload AAB to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: release-bundle/*.aab
          if-no-files-found: error

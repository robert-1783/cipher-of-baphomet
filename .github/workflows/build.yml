name: Build and Sign Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web Assets
        run: |
          npm ci || npm install
          npm run build --if-present

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || echo "Capacitor sync completed or not using npx"

      - name: Grant Execute Permissions for Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias baphomet-upload-key \
            -dname "CN=Vector Media & Design, OU=Development, O=Vector Media, L=Chicago, ST=Illinois, C=US" \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026"

      - name: Build Android App Bundle (Release)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease
          else
            cd android && ./gradlew bundleRelease
          fi

      - name: Sign Android App Bundle
        run: |
          AAB_FILE=$(find . -type f -name "*release*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find . -type f -name "*.aab" | head -n 1)
          fi
          echo "Signing bundle found at: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-upload-key.jks \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026" \
            "$AAB_FILE" baphomet-upload-key

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: "**/build/outputs/bundle/release/*.aab"
          retention-days: 7

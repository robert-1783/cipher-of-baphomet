name: Build and Sign Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Web Project & Capacitor 6
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "Cipher of Baphomet" "com.vectormediadesign.cipherofbaphomet" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Enforce MinSDK 24, TargetSDK 35 & VersionCode 3
        run: |
          # 1. Overwrite variables.gradle
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. Append properties to gradle.properties
          echo "minSdkVersion=24" >> android/gradle.properties
          echo "compileSdkVersion=35" >> android/gradle.properties
          echo "targetSdkVersion=35" >> android/gradle.properties

          # 3. Patch app/build.gradle directly to guarantee versionCode 3 and SDK 35
          python3 -c "
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          import re
          content = re.sub(r'versionCode\s+\d+', 'versionCode 3', content)
          content = re.sub(r'versionName\s+[\"\'][^\"\']+[\"\']', 'versionName \"1.0.3\"', content)

          with open(gradle_path, 'w') as f:
              f.write(content)
          "

          # 4. Add explicit uses-sdk to AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              data = f.read()

          if 'xmlns:tools=' not in data:
              data = data.replace('<manifest ', '<manifest xmlns:tools=\"http://schemas.android.com/tools\" ')

          uses_sdk_tag = '<uses-sdk android:minSdkVersion=\"24\" android:targetSdkVersion=\"35\" tools:replace=\"android:minSdkVersion,android:targetSdkVersion\" />\n'
          if '<uses-sdk' in data:
              import re
              data = re.sub(r'<uses-sdk[^>]*/>', uses_sdk_tag.strip(), data)
          else:
              data = data.replace('<application', uses_sdk_tag + '    <application')

          with open(manifest_path, 'w') as f:
              f.write(data)
          "

          # 5. Resolve Kotlin stdlib duplicates
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      }
                  }
              }
          }
          EOF

      - name: Restore Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > permanent-upload-key.jks

      - name: Build Android App Bundle (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease -PminSdkVersion=24 -PcompileSdkVersion=35 -PtargetSdkVersion=35

      - name: Sign Android App Bundle
        env:
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Signing bundle found at: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore permanent-upload-key.jks \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$KEY_ALIAS"

      - name: Inspect Built Manifest Inside AAB
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Verifying manifest attributes inside compiled AAB..."
          unzip -p "$AAB_FILE" base/manifest/AndroidManifest.xml | strings | grep -i -E "minsdk|targetsdk" || true

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 7

name: Build and Sign Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project Files
        id: locate
        run: |
          echo "=== Root contents ==="
          ls -la
          echo "=== Searching for Gradle build files ==="
          find . -maxdepth 4 -name "settings.gradle*" -o -name "build.gradle*"

          BUILD_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$BUILD_DIR" ]; then
            BUILD_DIR=$(find . -maxdepth 3 -name "build.gradle*" -exec dirname {} \; | head -n 1)
          fi
          echo "Detected project root: $BUILD_DIR"
          echo "project_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias baphomet-upload-key \
            -dname "CN=Vector Media & Design, OU=Development, O=Vector Media, L=Chicago, ST=Illinois, C=US" \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026"

      - name: Build Android App Bundle
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          echo "Working in: $(pwd)"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease
          else
            gradle bundleRelease
          fi

      - name: Sign Android App Bundle
        run: |
          AAB_FILE=$(find . -type f -name "*.aab" | head -n 1)
          echo "Signing bundle found at: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-upload-key.jks \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026" \
            "$AAB_FILE" baphomet-upload-key

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: "**/*.aab"
          retention-days: 7

name: Build and Sign Android App Bundle

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Web Project & Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Cipher of Baphomet" "com.vectormediadesign.cipherofbaphomet" --web-dir www
          npx cap add android
          npx cap copy android

      - name: Configure Target SDK 34 & Fix Kotlin Duplicates
        run: |
          # 1. Overwrite variables.gradle to enforce API 34 across all modules
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 2. Prevent legacy Kotlin duplicate class collisions
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  eachDependency { DependencyResolveDetails details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && 
                          (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                          details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.8.22")
                      }
                  }
              }
          }
          EOF

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release-upload-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias baphomet-upload-key \
            -dname "CN=Vector Media & Design, OU=Development, O=Vector Media, L=Chicago, ST=Illinois, C=US" \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026"

      - name: Build Android App Bundle (Release)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Sign Android App Bundle
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          echo "Signing bundle found at: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-upload-key.jks \
            -storepass "baphometReleasePass2026" \
            -keypass "baphometReleasePass2026" \
            "$AAB_FILE" baphomet-upload-key

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipher-of-baphomet-bundle
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 7
